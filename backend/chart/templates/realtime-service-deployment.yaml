apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-service
  namespace: {{ .Values.backendNamespace }}
  labels:
    app: realtime-service
spec:
  replicas: {{ .Values.realtime.replicas }}
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
    spec:
      containers:
        - name: realtime-service
          image: "{{ .Values.realtime.image }}:{{ .Values.realtime.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.realtime.port }}
          env:
            - name: PORT
              value: "{{ .Values.realtime.port | toString }}"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.realtime.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.realtime.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
