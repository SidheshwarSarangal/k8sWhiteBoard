apiVersion: v1
kind: Service
metadata:
  name: realtime-service
  namespace: {{ .Values.backendNamespace }}
  labels:
    app: realtime-service
spec:
  type: ClusterIP
  selector:
    app: realtime-service
  ports:
    - port: {{ .Values.realtime.port }}
      targetPort: {{ .Values.realtime.port }}
      protocol: TCP
      name: http
