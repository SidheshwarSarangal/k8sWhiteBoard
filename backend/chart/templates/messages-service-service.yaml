apiVersion: v1
kind: Service
metadata:
  name: messages-service
  namespace: {{ .Values.namespace }}
  labels:
    app: messages-service
spec:
  type: ClusterIP
  selector:
    app: messages-service
  ports:
    - port: {{ .Values.messages.port }}
      targetPort: {{ .Values.messages.port }}
      protocol: TCP
      name: http
