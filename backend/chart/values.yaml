# Namespace for all backend resources
namespace: whiteboard

# Secret with MONGO_URI and JWT_SECRET (create with kubectl create secret generic auth-secrets ...)
secretName: auth-secrets

# Ingress (single entrypoint; path-based routing)
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

# Services: image, tag, port, replicas (images must be built and loaded into cluster, e.g. kind)
auth:
  image: auth-service
  tag: latest
  port: 3000
  replicas: 1

rooms:
  image: rooms-service
  tag: latest
  port: 3001
  replicas: 1

drawings:
  image: drawings-service
  tag: latest
  port: 3002
  replicas: 1

messages:
  image: messages-service
  tag: latest
  port: 3003
  replicas: 1

realtime:
  image: realtime-service
  tag: latest
  port: 3004
  replicas: 1
