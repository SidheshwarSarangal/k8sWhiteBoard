# MongoDB in-cluster for local/dev (no Atlas). Use with auth-secrets MONGO_URI=mongodb://mongodb:27017/whiteboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: whiteboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: whiteboard
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: whiteboard-backend
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
