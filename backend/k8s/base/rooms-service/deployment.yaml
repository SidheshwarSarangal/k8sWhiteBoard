apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooms-service
  labels:
    app: rooms-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rooms-service
  template:
    metadata:
      labels:
        app: rooms-service
    spec:
      containers:
        - name: rooms-service
          image: rooms-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
