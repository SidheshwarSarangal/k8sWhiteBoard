apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whiteboard-backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3000
          - path: /api/rooms
            pathType: Prefix
            backend:
              service:
                name: rooms-service
                port:
                  number: 3001
          - path: /api/drawings
            pathType: Prefix
            backend:
              service:
                name: drawings-service
                port:
                  number: 3002
          - path: /api/messages
            pathType: Prefix
            backend:
              service:
                name: messages-service
                port:
                  number: 3003
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: realtime-service
                port:
                  number: 3004
